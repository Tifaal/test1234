<html>
    <head>
        <link rel="stylesheet" href={{ url_for("static", filename="styles.css") }} />
    </head>
    <body>
        <form method="post">
            <table border="1" class="table_1">
                <tr>
                    <td><h1>Калькулятор опыта майнкрафт</h1></td>
                </tr>
                <tr class="table_line_1">
                    <td>Имеющийся уровень:</td>
                    <td><input type="number", name="level_current" min="0" class="fon"></td>
                </tr>
                <tr class="table_line_2">
                    <td>Желаемый уровень</td>
                    <td><input type="number", name="level_target" min="0" class="fon"></td>
                </tr>                
                <tr  class="table_line_3">
                    <td colspan="2"><input type="submit", value="Посчитать" class="fon"></td>
                </tr>
            </table>
        </form>
        <table border="1">
            <tr class="table_line_1">
                <td>Current XP</td>
                <td>{{level_current}}</td>
            </tr>
            <tr  class="table_line_2">
                <td>Target XP</td>
                <td>{{level_target}}</td>
            </tr>
            <tr  class="table_line_3">
                <td>XP remaining</td>
                <td>{{need_xp}}</td>
            </tr>
        </table>
    </body>
</html>
